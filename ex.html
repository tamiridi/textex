<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdf4eb">
<title>Rooxy Alarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@800;900&display=swap">
<style>
/* Layout: one phone-height column; ring screen, roulette screen, alarm-off screen stacked and cross-faded. */
:root{
  color-scheme:light;
  --cream-1:#fef6ee; --cream-2:#fbeadb;
  --ink:#141414; --brown:#2b2320; --muted:#8e8a88;
  --red:#e85d50; --red-lo:#e2404a; --gold:#f5c88f; --pill:#e7e5ea;
  --night:#2a1640; --night-2:#4a1f5c;
  --top:max(14px, env(safe-area-inset-top, 0px));
  --bot:max(14px, env(safe-area-inset-bottom, 0px));
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#f6e6d6;color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:3px solid #7b5cff;outline-offset:3px}
.stage{height:100%;display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--cream-1) 0%,#fcf0e5 55%,var(--cream-2) 100%)}
.screen{position:absolute;inset:0;overflow:hidden;transition:opacity .35s ease;display:flex;flex-direction:column}
.screen.hide{opacity:0;pointer-events:none}

.logo{display:flex;align-items:center;justify-content:center;gap:10px}
.logo img{height:46px;width:auto;display:block}
.logo span{font-family:var(--round);font-weight:900;font-size:33px;letter-spacing:-.01em;color:var(--brown);line-height:1}
.brandtop{margin-top:calc(var(--top) + 30px);flex:none;position:relative;z-index:5}
.center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:3}
.title{text-align:center;padding:0 20px}
.title h1{margin:0;font-size:38px;font-weight:800;letter-spacing:-.025em;line-height:1.05;color:#0f0f0f;text-wrap:balance}
.title p{margin:10px 0 0;font-size:19px;color:var(--muted)}
.actions{position:relative;z-index:6;margin:14px 24px calc(var(--bot) + 24px);display:flex;flex-direction:column;align-items:center;gap:26px}
.btn-red{width:100%;height:70px;border-radius:22px;background:var(--red);color:#fff;font-size:24px;font-weight:700;box-shadow:0 10px 26px rgba(232,93,80,.22);transition:transform .12s}
.btn-red:active{transform:scale(.97)}
.btn-pill{height:52px;padding:0 30px;border-radius:26px;background:var(--pill);color:#1c1c1e;font-size:19px;font-weight:600}
.spark{position:absolute;width:24px;height:24px;color:var(--gold);animation:twinkle 2.8s ease-in-out infinite;pointer-events:none}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.7);opacity:.5}}

/* 1. ringing: the screaming chicken */
.chickwrap{position:relative;width:300px;height:300px;flex:none;display:flex;align-items:center;justify-content:center}
.chickwrap::before{content:"";position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle,rgba(244,170,160,.38) 0%,rgba(246,198,186,.2) 55%,rgba(255,255,255,0) 72%);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.chick{position:relative;width:190px;animation:freak .5s ease-in-out infinite}
@keyframes freak{0%{transform:rotate(-8deg) translateY(0) scale(1)}25%{transform:rotate(8deg) translateY(-14px) scale(1.06)}50%{transform:rotate(-6deg) translateY(0) scale(1)}75%{transform:rotate(7deg) translateY(-10px) scale(1.04)}100%{transform:rotate(-8deg) translateY(0) scale(1)}}
.bubble{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:max-content;max-width:300px;background:var(--red-lo);color:#fff;font-family:var(--round);font-weight:900;font-size:21px;line-height:1.1;text-align:center;padding:12px 18px;border-radius:22px;box-shadow:0 8px 20px rgba(226,64,74,.3);animation:shout .5s ease-in-out infinite alternate;z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-10px;border:11px solid transparent;border-bottom:0;border-top-color:var(--red-lo)}
@keyframes shout{from{transform:translateX(-50%) scale(1) rotate(-2deg)}to{transform:translateX(-50%) scale(1.07) rotate(2deg)}}
.zz{position:absolute;font-family:var(--round);font-weight:900;color:var(--red);font-size:26px;animation:pop 1s ease-out infinite;opacity:0}
@keyframes pop{0%{opacity:0;transform:translateY(0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1.2)}}

/* 2. roulette */
.wheel{background:radial-gradient(120% 80% at 50% 30%,#5b2a78 0%,var(--night) 70%,#180c26 100%);color:#fff}
.wheel .logo span{color:#fff}
.wheel .brandtop{margin-top:calc(var(--top) + 18px)}
.rt{font-family:var(--round);font-weight:900;font-size:40px;line-height:1;text-align:center;margin:10px 0 0;letter-spacing:.01em;background:linear-gradient(90deg,#ffd84d,#ff6b9a,#7cf0ff,#9dff7a,#ffd84d);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 2s linear infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
@keyframes hue{to{background-position:300% 0}}
.rs{text-align:center;font-size:16px;color:rgba(255,255,255,.75);margin-top:6px}
.wheelbox{position:relative;flex:none;margin-top:6px}
.wheelbox canvas{display:block;border-radius:50%}
.pointer{position:absolute;left:50%;top:-14px;margin-left:-20px;width:40px;height:50px;z-index:4;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.pointer.tick{animation:flick .09s ease-out}
@keyframes flick{50%{transform:rotate(-14deg)}}
.hub{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7e0,#ffd36b 70%,#e8a92a);box-shadow:0 0 0 5px #fff,0 6px 16px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:3}
.hub img{width:66px}
.bulbs{position:absolute;inset:0;pointer-events:none}
.bulbs i{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff6c2;box-shadow:0 0 10px 3px rgba(255,230,120,.9)}
.bulbs.a i:nth-child(odd),.bulbs.b i:nth-child(even){background:#ff5e7e;box-shadow:0 0 10px 3px rgba(255,80,120,.9)}
.spin{width:100%;height:72px;border-radius:24px;background:linear-gradient(180deg,#ffdd55,#ffb21e);color:#3a1a00;font-family:var(--round);font-weight:900;font-size:30px;letter-spacing:.04em;box-shadow:0 6px 0 #c77a00,0 14px 30px rgba(255,190,40,.45);animation:beg 1s ease-in-out infinite}
.spin:active{transform:translateY(4px);box-shadow:0 2px 0 #c77a00}
.spin[disabled]{animation:none;opacity:.55}
@keyframes beg{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:19}

/* result + fake message */
.result{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 22px;background:rgba(24,12,38,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
.result.on{opacity:1;pointer-events:auto}
.prize{font-family:var(--round);font-weight:900;font-size:46px;line-height:1;text-align:center;color:#ffd84d;text-shadow:0 4px 0 #b3361f,0 0 30px rgba(255,200,60,.6);transform:scale(.2);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.result.on .prize{transform:scale(1)}
.phone{width:100%;max-width:340px;background:#fff;color:#111;border-radius:26px;padding:14px 14px 16px;box-shadow:0 20px 50px rgba(0,0,0,.4);transform:translateY(40px);opacity:0;transition:transform .4s ease-out,opacity .4s}
.phone.on{transform:none;opacity:1}
.phone .to{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid #eee;font-size:15px;color:#666}
.phone .to b{color:#111;font-size:17px}
.phone .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ff9a9e,#fad0c4);display:flex;align-items:center;justify-content:center;font-size:20px}
.thread{display:flex;flex-direction:column;gap:6px;padding-top:12px;min-height:150px}
.m{max-width:78%;padding:9px 14px;border-radius:20px;font-size:17px;line-height:1.25;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}
.m.me{align-self:flex-end;background:#0a84ff;color:#fff;border-bottom-right-radius:6px}
.m.them{align-self:flex-start;background:#e9e9eb;color:#111;border-bottom-left-radius:6px}
.st{align-self:flex-end;font-size:12px;color:#8e8e93;margin-top:-2px}
.typing{align-self:flex-start;background:#e9e9eb;border-radius:20px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:8px;height:8px;border-radius:50%;background:#9a9aa0;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.result .btn-red{max-width:340px;opacity:0;transform:translateY(20px);transition:all .4s}
.result .btn-red.on{opacity:1;transform:none}

/* 3. alarm off */
.done .art{position:relative;width:260px;height:260px;flex:none;display:flex;align-items:center;justify-content:center}
.done .art::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(250,214,170,.42) 0%,rgba(250,224,196,.18) 55%,rgba(255,255,255,0) 72%)}
.done .art img{position:relative;width:160px;animation:fly 2.2s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}

@media (max-height:720px){
  .chickwrap{transform:scale(.8);margin:-30px 0}
  .title h1{font-size:32px}
  .actions{gap:16px}
  .btn-red{height:62px;font-size:22px}
  .rt{font-size:32px}
  .spin{height:62px;font-size:26px}
  .done .art{transform:scale(.8);margin:-26px 0}
}
@media (prefers-reduced-motion:reduce){.chick,.bubble,.chickwrap::before,.spin,.rt,.done .art img{animation:none!important}}
</style>
</head>

  {t:"SING IN THE SHOWER", s:"SING", e:"🎤", c:"#00b3a4"}
];
const LAND = 0;
const MESSAGES = [
  {who:"me", t:"hey… I miss you 🥺", wait:700},
  {who:"st", t:"Delivered", wait:900},
  {who:"typing", wait:1700},
  {who:"them", t:"who is this??", wait:900},
  {who:"them", t:"wait… is this the alarm again 💀", wait:0}
];

/* ---------- audio ---------- */
let ctx = null;
const ac = () => { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state !== "running") ctx.resume(); return ctx; };
function tone(f, d, type="square", vol=.08, when=0){
  try{
    const c = ac(), o = c.createOscillator(), g = c.createGain(), s = c.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f, s);
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(vol, s + .008); g.gain.exponentialRampToValueAtTime(.0001, s + d);
    o.connect(g).connect(c.destination); o.start(s); o.stop(s + d + .02);
  }catch(e){}
}
function squawk(){ /* chicken bawk: falling sawtooth chirps */
  try{
    const c = ac();
    [0, .16].forEach((w, k) => {
      const o = c.createOscillator(), g = c.createGain(), s = c.currentTime + w;
      o.type = "sawtooth"; o.frequency.setValueAtTime(k ? 900 : 700, s); o.frequency.exponentialRampToValueAtTime(k ? 380 : 300, s + .14);
      g.gain.setValueAtTime(.0001, s); g.gain.linearRampToValueAtTime(.12, s + .01); g.gain.exponentialRampToValueAtTime(.0001, s + .15);
      o.connect(g).connect(c.destination); o.start(s); o.stop(s + .17);
    });
  }catch(e){}
}
function say(text, pitch=2, rate=1.25){
  try{
    if (!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.pitch = pitch; u.rate = rate; u.volume = 1; u.lang = "en-US";
    speechSynthesis.speak(u);
  }catch(e){}
}
const shutUp = () => { try{ speechSynthesis.cancel(); }catch(e){} };

/* ringing loop: beep beep + bawk + the chicken yelling the same line, over and over */
let ringTimer = null, ringing = false, n = 0;
function startRing(){
  if (ringing || q.get("sound") === "0") return;
  ringing = true; n = 0;
  const loop = () => {
    for (let k = 0; k < 4; k++) tone(k % 2 ? 1760 : 1568, .1, "square", .07, k * .13);
    if (n % 2 === 0){ squawk(); }
    if (n % 3 === 0){ shutUp(); say("Wake up or I will text your ex!"); }
    if (navigator.vibrate) navigator.vibrate([250, 150, 250]);
    n++;
  };
  loop(); ringTimer = setInterval(loop, 1100);
}
function stopRing(){ ringing = false; clearInterval(ringTimer); shutUp(); if (navigator.vibrate) navigator.vibrate(0); }
$("#ring").addEventListener("pointerdown", e => { if (!e.target.closest("button")) startRing(); });

/* ---------- screens ---------- */
const screens = { ring:$("#ring"), wheel:$("#wheel"), done:$("#done") };
const show = name => Object.entries(screens).forEach(([k, el]) => el.classList.toggle("hide", k !== name));
const win = new Audio("victory.mp3"); win.preload = "auto";

/* ---------- wheel drawing ---------- */
const cv = $("#cv"), g2 = cv.getContext("2d");
let size = 300, angle = 0, spinning = false, spun = false;
function layout(){
  const box = $("#wheel .center");
  const avail = Math.min(box.clientWidth - 40, box.clientHeight - 110);
  size = Math.max(200, Math.min(330, avail));
  const dpr = window.devicePixelRatio || 1;
  cv.width = size * dpr; cv.height = size * dpr; cv.style.width = cv.style.height = size + "px";
  g2.setTransform(dpr, 0, 0, dpr, 0, 0);
  const wb = $("#wheelbox"); wb.style.width = wb.style.height = size + "px";
  const bulbs = $("#bulbs"); bulbs.innerHTML = "";
  for (let i = 0; i < 20; i++){
    const a = i / 20 * Math.PI * 2, r = size / 2 - 7;
    const b = document.createElement("i"); b.style.left = (size/2 + Math.cos(a) * r) + "px"; b.style.top = (size/2 + Math.sin(a) * r) + "px"; bulbs.appendChild(b);
  }
  draw();
}
function draw(){
  const r = size / 2, N = SLICES.length, seg = Math.PI * 2 / N;
  g2.clearRect(0, 0, size, size);
  g2.save(); g2.translate(r, r);
  g2.beginPath(); g2.arc(0, 0, r, 0, Math.PI * 2); g2.fillStyle = "#ffd84d"; g2.fill();
  g2.rotate(angle);
  SLICES.forEach((s, i) => {
    const a0 = -Math.PI / 2 - seg / 2 + i * seg;
    g2.beginPath(); g2.moveTo(0, 0); g2.arc(0, 0, r - 14, a0, a0 + seg); g2.closePath();
    g2.fillStyle = s.c; g2.fill(); g2.strokeStyle = "rgba(255,255,255,.85)"; g2.lineWidth = 3; g2.stroke();
    g2.save(); g2.rotate(a0 + seg / 2);
    g2.textAlign = "right"; g2.textBaseline = "middle"; g2.fillStyle = "#fff";
    g2.shadowColor = "rgba(0,0,0,.35)"; g2.shadowBlur = 3;
    const fs = Math.max(10, Math.round(size / 21));
    g2.font = `900 ${fs}px Nunito, ui-rounded, sans-serif`;
    g2.fillText(s.s, r - 24, 1, r * .42);
    g2.font = `${Math.round(fs * 1.3)}px sans-serif`; g2.textAlign = "center"; g2.shadowBlur = 0;
    g2.fillText(s.e, r * .37, 1);
    g2.restore();
  });
  g2.restore();
}
addEventListener("resize", layout);

/* lights blink faster while spinning */
let bulbT = null;
function bulbs(ms){ clearInterval(bulbT); bulbT = setInterval(() => { const b = $("#bulbs"); b.classList.toggle("a"); b.classList.toggle("b"); }, ms); }
bulbs(400);

/* ---------- spin ---------- */
function spin(){
  if (spinning) return;
  spinning = true; $("#spinBtn").disabled = true; bulbs(90);
  const N = SLICES.length, seg = Math.PI * 2 / N;
  const target = spun ? Math.floor(Math.random() * N) : LAND;
  const start = angle % (Math.PI * 2);
  const jitter = (Math.random() - .5) * seg * .5;
  const end = Math.PI * 2 * 7 + (Math.PI * 2 - target * seg) + jitter;
  const T = 5200, t0 = performance.now();
  let lastSeg = Math.floor((start + seg / 2) / seg);
  say("Spin it! Spin it!", 2, 1.4);
  const ease = t => 1 - Math.pow(1 - t, 4);
  const step = now => {
    const t = Math.min(1, (now - t0) / T);
    angle = start + (end - start) * ease(t);
    draw();
    const s = Math.floor((angle + seg / 2) / seg);
    if (s !== lastSeg){
      lastSeg = s;
      tone(1200 + Math.random() * 500, .045, "triangle", .12);
      const p = $("#pointer"); p.classList.remove("tick"); void p.offsetWidth; p.classList.add("tick");
      if (navigator.vibrate) navigator.vibrate(8);
    }
    if (t < 1) requestAnimationFrame(step); else landed(target);
  };
  requestAnimationFrame(step);
}
function landed(i){
  spinning = false; spun = true; bulbs(150);
  const s = SLICES[i];
  /* fanfare */
  [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, .22, "square", .09, k * .09));
  [1047, 1319, 1568].forEach((f, k) => tone(f, .5, "triangle", .07, .5 + k * .02));
  $("#flash").classList.remove("go"); void $("#flash").offsetWidth; $("#flash").classList.add("go");
  confetti(); squawk();
  $("#prize").textContent = s.e + " " + s.t;
  setTimeout(() => {
    $("#result").classList.add("on");
    if (i === LAND || /EX/.test(s.t)){ say("Too late! I'm texting your ex!", 2, 1.3); setTimeout(textEx, 900); }
    else { say(s.t.toLowerCase() + "!", 2, 1.3); setTimeout(() => $("#upBtn").classList.add("on"), 700); $("#phone").style.display = "none"; }
  }, 700);
}
function textEx(){
  $("#phone").style.display = ""; $("#phone").classList.add("on");
  const th = $("#thread"); th.innerHTML = "";
  let i = 0;
  const next = () => {
    const m = MESSAGES[i++]; if (!m){ $("#upBtn").classList.add("on"); return; }
    const old = th.querySelector(".typing"); if (old) old.remove();
    const el = document.createElement("div");
    if (m.who === "typing"){ el.className = "typing"; el.innerHTML = "<i></i><i></i><i></i>"; }
    else if (m.who === "st"){ el.className = "st"; el.textContent = m.t; }
    else { el.className = "m " + m.who; el.textContent = m.t; tone(m.who === "me" ? 880 : 660, .12, "sine", .1); tone(m.who === "me" ? 1320 : 990, .14, "sine", .08, .07); }
    th.appendChild(el);
    setTimeout(next, m.wait);
  };
  setTimeout(next, 400);
}

/* ---------- confetti ---------- */
const cc = $("#confetti"), c2 = cc.getContext("2d");
let parts = [], confT = null;
function confetti(){
  const W = cc.clientWidth, H = cc.clientHeight, dpr = window.devicePixelRatio || 1;
  cc.width = W * dpr; cc.height = H * dpr; c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ["#ffd84d","#ff3d6e","#1ec8ff","#2bd67b","#8a5cff","#ff7a2e","#ffffff"];
  for (let i = 0; i < 160; i++) parts.push({x:W/2, y:H*.42, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, s:Math.random()*7+4, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[i % cols.length], life:0});
  if (!confT) confT = requestAnimationFrame(tickConf);
}
function tickConf(){
  const W = cc.clientWidth, H = cc.clientHeight;
  c2.clearRect(0, 0, W, H);
  parts.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    c2.save(); c2.translate(p.x, p.y); c2.rotate(p.r); c2.fillStyle = p.c; c2.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); c2.restore(); });
  parts = parts.filter(p => p.y < H + 20 && p.life < 240);
  confT = parts.length ? requestAnimationFrame(tickConf) : null;
}

/* ---------- navigation ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  const go = b.dataset.go;
  if (go === "wheel"){
    stopRing(); show("wheel"); layout(); ac();
    $("#result").classList.remove("on"); $("#upBtn").classList.remove("on"); $("#phone").classList.remove("on"); $("#spinBtn").disabled = false;
    say("Snooze? Oh no no no. Spin the wheel!", 2, 1.3);
  } else if (go === "done"){
    shutUp(); show("done"); confetti(); try{ win.currentTime = 0; win.play().catch(()=>{}); }catch(e){}
  } else if (go === "ring"){ show("ring"); spun = false; startRing(); }
});
$("#spinBtn").addEventListener("click", spin);
layout();
</script>
